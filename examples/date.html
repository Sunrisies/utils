<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>相对时间工具示例</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .time-demo {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin: 2rem 0;
        }

        .input-group {
            margin: 1.5rem 0;
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .input-group label {
            min-width: 100px;
            color: #666;
            font-weight: 500;
        }

        .input-group input,
        .input-group select {
            flex: 1;
            min-width: 200px;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .input-group input:focus,
        .input-group select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #2980b9;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        .result {
            margin-top: 2rem;
            padding: 1.5rem;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid var(--primary-color);
        }

        .result p {
            margin: 0;
            color: #2c3e50;
            font-size: 1.1rem;
        }

        #result {
            font-weight: 600;
            color: var(--primary-color);
            margin-left: 0.5rem;
        }

        .code-example {
            margin-top: 3rem;
            background: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .code-example pre {
            background: #2c3e50;
            color: #fff;
            padding: 1.5rem;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .code-example pre code {
            color: #fff;
            font-family: 'Fira Code', 'Consolas', monospace;
        }

        @media (max-width: 768px) {
            .input-group {
                flex-direction: column;
                align-items: stretch;
                gap: 0.5rem;
            }

            .input-group label {
                min-width: auto;
            }

            .input-group input,
            .input-group select {
                min-width: auto;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>相对时间工具示例</h1>
        <a href="index.html" class="back-link">返回首页</a>
    </header>
    <main>
        <section class="demo">
            <h2>实时演示</h2>
            <div class="time-demo">
                <div class="input-group">
                    <label>目标时间：</label>
                    <input type="datetime-local" id="targetDate">
                </div>
                <div class="input-group">
                    <label>参考时间：</label>
                    <input type="datetime-local" id="referenceDate">
                    <button id="useCurrentTime">使用当前时间</button>
                </div>
                <div class="input-group">
                    <label>语言：</label>
                    <select id="locale">
                        <option value="zh-CN">中文</option>
                        <option value="en-US">英文</option>
                    </select>
                </div>
                <div class="result">
                    <p>相对时间结果：<span id="result">-</span></p>
                </div>
            </div>
        </section>
        <section class="code-example">
            <h2>代码示例</h2>
            <pre><code id="codeExample"></code></pre>
        </section>
    </main>
    <script type="module">
        import { getRelativeTime } from '../dist/index.esm.js';

        const targetDateInput = document.getElementById('targetDate');
        const referenceDateInput = document.getElementById('referenceDate');
        const useCurrentTimeBtn = document.getElementById('useCurrentTime');
        const localeSelect = document.getElementById('locale');
        const resultSpan = document.getElementById('result');
        const codeExample = document.getElementById('codeExample');

        // 设置默认值为当前时间
        const now = new Date();
        targetDateInput.value = now.toISOString().slice(0, 16);
        referenceDateInput.value = now.toISOString().slice(0, 16);

        function updateResult() {
            try {
                const targetDate = new Date(targetDateInput.value);
                const referenceDate = new Date(referenceDateInput.value);
                const locale = localeSelect.value;

                const result = getRelativeTime(targetDate, {
                    now: referenceDate,
                    locale
                });

                resultSpan.textContent = result;
            } catch (error) {
                resultSpan.textContent = `错误: ${error.message}`;
            }
        }

        // 事件监听
        targetDateInput.addEventListener('change', updateResult);
        referenceDateInput.addEventListener('change', updateResult);
        localeSelect.addEventListener('change', updateResult);
        useCurrentTimeBtn.addEventListener('click', () => {
            referenceDateInput.value = new Date().toISOString().slice(0, 16);
            updateResult();
        });

        // 显示示例代码
        codeExample.textContent = `
// 基本用法
getRelativeTime(new Date("2024-01-01")); // 默认使用当前时间作为参考点

// 指定参考时间和语言
getRelativeTime(new Date("2024-01-01"), {
    now: new Date("2024-02-01"),
    locale: "en-US"
});

// 自定义文案
getRelativeTime(new Date("2024-01-01"), {
    messages: {
        days: "{count} 天",
        past: "{time}之前"
    }
});
        `.trim();

        // 初始化显示
        updateResult();
    </script>
</body>

</html>
